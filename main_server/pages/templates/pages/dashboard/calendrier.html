{% extends 'base.html' %}

{% block title %}Calendrier - LearnHub{% endblock %}

{% block extra_styles %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css">

<style>
    /* Styles spécifiques à la page Calendrier */

    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2.5rem;
        padding: 1.5rem;
        background: var(--bg-white);
        border-radius: 20px;
        box-shadow: var(--shadow);
        width: 100%;
    }

    .welcome-section h1 {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--text-dark);
        font-family: 'Poppins', sans-serif;
    }

    .welcome-section p {
        color: var(--text-light);
        margin-top: 0.3rem;
        font-size: 1rem;
    }

    .calendar-actions {
        display: flex;
        gap: 1rem;
        align-items: center;
    }

    .today-btn {
        background: var(--gradient-blue);
        color: white;
        border: none;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s ease;
    }

    .today-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
    }

    .view-toggle {
        display: flex;
        background: var(--bg-white);
        border-radius: 10px;
        padding: 0.3rem;
        border: 2px solid var(--border-color);
    }

    .view-btn {
        padding: 0.5rem 1rem;
        border: none;
        background: transparent;
        border-radius: 8px;
        cursor: pointer;
        color: var(--text-light);
        transition: all 0.3s ease;
    }

    .view-btn.active {
        background: var(--primary-blue);
        color: white;
    }

    /* Calendar Container */
    .calendar-container {
        background: var(--bg-white);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
        margin-bottom: 2rem;
    }

    /* Custom FullCalendar Styling */
    .fc {
        font-family: 'Inter', sans-serif;
    }

    .fc-toolbar-chunk {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .fc-toolbar-title {
        font-size: 1.5rem !important;
        font-weight: 700 !important;
        color: var(--text-dark) !important;
        font-family: 'Poppins', sans-serif !important;
    }

    .fc-button {
        background: var(--bg-white) !important;
        border: 2px solid var(--border-color) !important;
        color: var(--text-dark) !important;
        font-weight: 500 !important;
        border-radius: 10px !important;
        padding: 0.5rem 1rem !important;
        transition: all 0.3s ease !important;
    }

    .fc-button:hover {
        background: var(--light-blue) !important;
        border-color: var(--primary-blue) !important;
        color: var(--primary-blue) !important;
        transform: translateY(-2px) !important;
    }

    .fc-button-primary:not(:disabled).fc-button-active {
        background: var(--gradient-blue) !important;
        border-color: var(--primary-blue) !important;
        color: white !important;
    }

    .fc-day-today {
        background-color: rgba(74, 144, 226, 0.1) !important;
    }

    .fc-col-header-cell {
        background: var(--bg-light) !important;
        padding: 1rem 0 !important;
        font-weight: 600 !important;
        color: var(--text-dark) !important;
        border: none !important;
    }

    .fc-col-header-cell-cushion {
        padding: 0.5rem !important;
    }

    .fc-daygrid-day-frame {
        min-height: 100px !important;
        padding: 0.5rem !important;
        transition: all 0.3s ease !important;
    }

    .fc-daygrid-day:hover {
        background: var(--light-blue) !important;
    }

    /* Event Styling */
    .fc-event {
        border: none !important;
        border-radius: 8px !important;
        padding: 0.3rem 0.5rem !important;
        margin: 2px 0 !important;
        font-size: 0.85rem !important;
        cursor: pointer !important;
        transition: all 0.3s ease !important;
    }

    .fc-event:hover {
        transform: translateX(3px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .event-cours {
        background: var(--gradient-blue) !important;
    }

    .event-devoir {
        background: var(--gradient-red) !important;
    }

    .event-examen {
        background: var(--gradient-purple) !important;
    }

    .event-live {
        background: var(--gradient-orange) !important;
    }

    .event-personnel {
        background: var(--gradient-green) !important;
    }

    .fc-event-time {
        font-weight: 600 !important;
    }

    .fc-event-title {
        font-weight: 500 !important;
    }

    /* Upcoming Events */
    .upcoming-events {
        background: var(--bg-white);
        border-radius: 20px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
    }

    .section-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-dark);
        margin-bottom: 1.5rem;
        font-family: 'Poppins', sans-serif;
    }

    .events-list {
        display: flex;
        flex-direction: column;
        gap: 1rem;
    }

    .event-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem;
        background: var(--bg-light);
        border-radius: 15px;
        transition: all 0.3s ease;
        cursor: pointer;
        border-left: 4px solid var(--primary-blue);
    }

    .event-item:hover {
        transform: translateX(5px);
        background: var(--light-blue);
    }

    .event-item.devoir {
        border-left-color: var(--accent-red);
    }

    .event-item.examen {
        border-left-color: var(--secondary-purple);
    }

    .event-item.live {
        border-left-color: var(--accent-orange);
    }

    .event-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1rem;
    }

    .event-icon.cours {
        background: var(--gradient-blue);
    }

    .event-icon.devoir {
        background: var(--gradient-red);
    }

    .event-icon.examen {
        background: var(--gradient-purple);
    }

    .event-icon.live {
        background: var(--gradient-orange);
    }

    .event-content {
        flex: 1;
    }

    .event-title {
        font-weight: 600;
        color: var(--text-dark);
        margin-bottom: 0.2rem;
    }

    .event-details {
        display: flex;
        gap: 1rem;
        font-size: 0.85rem;
        color: var(--text-light);
    }

    .event-time {
        display: flex;
        align-items: center;
        gap: 0.3rem;
    }

    .event-actions {
        display: flex;
        gap: 0.5rem;
    }

    .event-btn {
        width: 35px;
        height: 35px;
        border-radius: 8px;
        border: none;
        background: var(--bg-white);
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .event-btn:hover {
        background: var(--primary-blue);
        color: white;
    }

    /* Add Event Modal */
    .add-event-btn {
        background: var(--gradient-purple);
        color: white;
        border: none;
        padding: 0.8rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s ease;
        margin-bottom: 1.5rem;
    }

    .add-event-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(155, 81, 224, 0.3);
    }

    /* Modal Styles */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .modal.active {
        display: flex;
    }

    .modal-content {
        background: var(--bg-white);
        border-radius: 20px;
        padding: 2rem;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
        animation: modalSlideIn 0.3s ease;
    }

    @keyframes modalSlideIn {
        from {
            opacity: 0;
            transform: translateY(-50px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
    }

    .modal-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-dark);
    }

    .close-modal {
        background: none;
        border: none;
        font-size: 1.5rem;
        color: var(--text-light);
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .close-modal:hover {
        color: var(--accent-red);
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--text-dark);
    }

    .form-input {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .form-input:focus {
        outline: none;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    .form-select {
        width: 100%;
        padding: 0.8rem 1rem;
        border: 2px solid var(--border-color);
        border-radius: 10px;
        font-size: 1rem;
        background: white;
        cursor: pointer;
    }

    .color-options {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
    }

    .color-option {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        cursor: pointer;
        border: 3px solid transparent;
        transition: all 0.3s ease;
    }

    .color-option.active {
        border-color: var(--text-dark);
        transform: scale(1.1);
    }

    .modal-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        margin-top: 2rem;
    }

    .btn {
        padding: 0.8rem 1.5rem;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        border: none;
    }

    .btn-cancel {
        background: var(--bg-light);
        color: var(--text-light);
    }

    .btn-cancel:hover {
        background: #e5e7eb;
    }

    .btn-save {
        background: var(--gradient-blue);
        color: white;
    }

    .btn-save:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
    }

    /* Current date */
    .current-date {
        font-size: 0.9rem;
        color: var(--text-light);
        background: var(--bg-light);
        padding: 0.5rem 1rem;
        border-radius: 10px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .top-bar {
            flex-direction: column;
            gap: 1rem;
        }
        
        .calendar-actions {
            width: 100%;
            justify-content: center;
        }
        
        .fc-toolbar {
            flex-direction: column !important;
            gap: 1rem !important;
        }
        
        .fc-toolbar-chunk {
            justify-content: center;
        }
    }

    @media (max-width: 480px) {
        .event-details {
            flex-direction: column;
            gap: 0.3rem;
        }
        
        .event-actions {
            display: none;
        }
    }
</style>
{% endblock %}

{% block content %}
<!-- Top Bar avec menu toggle intégré -->
<div style="position: relative;">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="welcome-section">
            <h1>Calendrier 📅</h1>
            <p>Visualisez et gérez votre emploi du temps</p>
        </div>
        <div class="current-date">
            <i class="far fa-calendar"></i>
            <span id="currentDate"></span>
        </div>
    </div>
</div>

<!-- Calendar Actions -->
<div class="calendar-actions">
    <button class="today-btn" id="todayBtn">
        <i class="fas fa-calendar-day"></i> Aujourd'hui
    </button>
    <div class="view-toggle">
        <button class="view-btn active" data-view="dayGridMonth">
            <i class="fas fa-calendar-alt"></i> Mois
        </button>
        <button class="view-btn" data-view="timeGridWeek">
            <i class="fas fa-calendar-week"></i> Semaine
        </button>
        <button class="view-btn" data-view="timeGridDay">
            <i class="fas fa-calendar-day"></i> Jour
        </button>
    </div>
</div>

<!-- Add Event Button -->
<button class="add-event-btn" id="addEventBtn">
    <i class="fas fa-plus"></i> Ajouter un événement
</button>

<!-- Calendar -->
<div class="calendar-container">
    <div id="calendar"></div>
</div>

<!-- Upcoming Events -->
<div class="upcoming-events">
    <h3 class="section-title">Événements à venir</h3>
    <div class="events-list" id="upcomingEvents">
        <!-- Events will be dynamically populated -->
    </div>
</div>

<!-- Add Event Modal -->
<div class="modal" id="eventModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 class="modal-title">Ajouter un événement</h3>
            <button class="close-modal" id="closeModal">&times;</button>
        </div>
        <form id="eventForm">
            <div class="form-group">
                <label class="form-label">Titre de l'événement</label>
                <input type="text" class="form-input" id="eventTitle" required placeholder="Ex: Cours de React">
            </div>
            
            <div class="form-group">
                <label class="form-label">Type d'événement</label>
                <select class="form-select" id="eventType">
                    <option value="cours">Cours</option>
                    <option value="devoir">Devoir</option>
                    <option value="examen">Examen</option>
                    <option value="live">Session Live</option>
                    <option value="personnel">Personnel</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Date et heure</label>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <input type="datetime-local" class="form-input" id="eventStart" required>
                    <input type="datetime-local" class="form-input" id="eventEnd" required>
                </div>
            </div>
            
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea class="form-input" id="eventDescription" rows="3" placeholder="Description de l'événement..."></textarea>
            </div>
            
            <div class="form-group">
                <label class="form-label">Couleur</label>
                <div class="color-options">
                    <div class="color-option active" style="background: #4A90E2;" data-color="#4A90E2"></div>
                    <div class="color-option" style="background: #9B51E0;" data-color="#9B51E0"></div>
                    <div class="color-option" style="background: #FF5252;" data-color="#FF5252"></div>
                    <div class="color-option" style="background: #27AE60;" data-color="#27AE60"></div>
                    <div class="color-option" style="background: #FF7A45;" data-color="#FF7A45"></div>
                </div>
            </div>
            
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" id="cancelBtn">Annuler</button>
                <button type="submit" class="btn btn-save">Enregistrer</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- FullCalendar Library -->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/fr.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Afficher la date actuelle
        function updateDate() {
            const now = new Date();
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            const dateElement = document.getElementById('currentDate');
            if (dateElement) {
                dateElement.textContent = now.toLocaleDateString('fr-FR', options);
            }
        }
        updateDate();
        
        // Initialize calendar
        const calendarEl = document.getElementById('calendar');
        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            locale: 'fr',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            buttonText: {
                today: 'Aujourd\'hui',
                month: 'Mois',
                week: 'Semaine',
                day: 'Jour'
            },
            events: [
                {
                    title: 'Cours React',
                    start: new Date(),
                    end: new Date(new Date().setHours(new Date().getHours() + 2)),
                    className: 'event-cours',
                    extendedProps: {
                        type: 'cours',
                        description: 'Cours avancé sur les Hooks React'
                    }
                },
                {
                    title: 'Devoir ML',
                    start: new Date(new Date().setDate(new Date().getDate() + 1)),
                    end: new Date(new Date().setDate(new Date().getDate() + 1)),
                    className: 'event-devoir',
                    extendedProps: {
                        type: 'devoir',
                        description: 'Devoir de machine learning à rendre'
                    }
                },
                {
                    title: 'Examen Final',
                    start: new Date(new Date().setDate(new Date().getDate() + 3)),
                    end: new Date(new Date().setDate(new Date().getDate() + 3)),
                    className: 'event-examen',
                    extendedProps: {
                        type: 'examen',
                        description: 'Examen final de développement web'
                    }
                },
                {
                    title: 'Session Live Design',
                    start: new Date(new Date().setDate(new Date().getDate() + 5)),
                    end: new Date(new Date().setDate(new Date().getDate() + 5)),
                    className: 'event-live',
                    extendedProps: {
                        type: 'live',
                        description: 'Session live sur le design UI/UX'
                    }
                }
            ],
            eventClick: function(info) {
                alert(
                    `Événement: ${info.event.title}\n` +
                    `Description: ${info.event.extendedProps.description || 'Pas de description'}\n` +
                    `Type: ${info.event.extendedProps.type || 'Non spécifié'}`
                );
            },
            dateClick: function(info) {
                document.getElementById('eventStart').value = info.dateStr + 'T10:00';
                document.getElementById('eventEnd').value = info.dateStr + 'T12:00';
                openModal();
            }
        });
        calendar.render();

        // View toggle buttons
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const view = this.dataset.view;
                document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                calendar.changeView(view);
            });
        });

        // Today button
        document.getElementById('todayBtn').addEventListener('click', function() {
            calendar.today();
        });

        // Modal functionality
        const modal = document.getElementById('eventModal');
        const addEventBtn = document.getElementById('addEventBtn');
        const closeModal = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const eventForm = document.getElementById('eventForm');
        const colorOptions = document.querySelectorAll('.color-option');

        function openModal() {
            modal.classList.add('active');
        }

        function closeModalFunc() {
            modal.classList.remove('active');
            eventForm.reset();
            colorOptions.forEach(opt => opt.classList.remove('active'));
            colorOptions[0].classList.add('active');
        }

        addEventBtn.addEventListener('click', openModal);
        closeModal.addEventListener('click', closeModalFunc);
        cancelBtn.addEventListener('click', closeModalFunc);

        // Color selection
        colorOptions.forEach(option => {
            option.addEventListener('click', function() {
                colorOptions.forEach(opt => opt.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // Form submission
        eventForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const title = document.getElementById('eventTitle').value;
            const type = document.getElementById('eventType').value;
            const start = document.getElementById('eventStart').value;
            const end = document.getElementById('eventEnd').value;
            const description = document.getElementById('eventDescription').value;
            const color = document.querySelector('.color-option.active').dataset.color;
            
            // Add event to calendar
            calendar.addEvent({
                title: title,
                start: start,
                end: end,
                className: `event-${type}`,
                extendedProps: {
                    type: type,
                    description: description
                }
            });
            
            // Update upcoming events
            updateUpcomingEvents();
            
            // Close modal and reset form
            closeModalFunc();
            
            alert('Événement ajouté avec succès!');
        });

        // Update upcoming events list
        function updateUpcomingEvents() {
            const events = calendar.getEvents();
            const upcomingEvents = events.filter(event => 
                event.start >= new Date() && event.start <= new Date(Date.now() + 7 * 24 * 60 * 60 * 1000)
            ).sort((a, b) => a.start - b.start);
            
            const eventsList = document.getElementById('upcomingEvents');
            eventsList.innerHTML = '';
            
            upcomingEvents.slice(0, 5).forEach(event => {
                const eventItem = document.createElement('div');
                eventItem.className = `event-item ${event.extendedProps.type}`;
                
                const iconClass = {
                    'cours': 'fas fa-book',
                    'devoir': 'fas fa-tasks',
                    'examen': 'fas fa-file-alt',
                    'live': 'fas fa-video',
                    'personnel': 'fas fa-user'
                }[event.extendedProps.type] || 'fas fa-calendar';
                
                const eventDate = event.start.toLocaleDateString('fr-FR', {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric'
                });
                
                const eventTime = event.start.toLocaleTimeString('fr-FR', {
                    hour: '2-digit',
                    minute: '2-digit'
                });
                
                eventItem.innerHTML = `
                    <div class="event-icon ${event.extendedProps.type}">
                        <i class="${iconClass}"></i>
                    </div>
                    <div class="event-content">
                        <div class="event-title">${event.title}</div>
                        <div class="event-details">
                            <div class="event-time">
                                <i class="far fa-calendar"></i> ${eventDate}
                            </div>
                            <div class="event-time">
                                <i class="far fa-clock"></i> ${eventTime}
                            </div>
                        </div>
                    </div>
                    <div class="event-actions">
                        <button class="event-btn" title="Éditer">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="event-btn" title="Supprimer">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                eventsList.appendChild(eventItem);
            });
        }

        // Initial update of upcoming events
        updateUpcomingEvents();

        // Update calendar on window resize
        window.addEventListener('resize', function() {
            calendar.updateSize();
        });
    });
</script>
{% endblock %}
